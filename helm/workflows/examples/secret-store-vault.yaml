# HashiCorp Vault SecretStore and ExternalSecret
# Prerequisites:
#   1. Vault server accessible from cluster
#   2. Kubernetes auth method configured in Vault
#   3. External Secrets Operator installed
#   4. Vault KV secret exists at secret/data/workflows/prod with the properties listed below
#
# Apply with: kubectl apply -f secret-store-vault.yaml -n workflows
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: workflows
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "workflows-role"
          serviceAccountRef:
            name: workflows-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workflows-app-secrets
  namespace: workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: workflows-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: workflows/prod
        property: DATABASE_URL
    - secretKey: TEMPORAL_API_KEY
      remoteRef:
        key: workflows/prod
        property: TEMPORAL_API_KEY
    - secretKey: ELEVENLABS_API_KEY
      remoteRef:
        key: workflows/prod
        property: ELEVENLABS_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: workflows/prod
        property: OPENAI_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: workflows/prod
        property: ANTHROPIC_API_KEY
