# Doppler SecretStore and ExternalSecret
# Prerequisites:
#   1. Doppler Service Token
#   2. External Secrets Operator installed
#   3. Doppler project/config contains the properties listed below
#
# Create the Doppler token secret first:
#   kubectl create secret generic doppler-token \
#     --from-literal=token=dp.st.xxxx \
#     -n workflows
#
# Apply with: kubectl apply -f secret-store-doppler.yaml -n workflows
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: doppler-store
  namespace: workflows
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            key: token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workflows-app-secrets
  namespace: workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-store
    kind: SecretStore
  target:
    name: workflows-secrets
    creationPolicy: Owner
  data:
    - secretKey: PG_BASE_URL
      remoteRef:
        key: WORKFLOWS_PROD
        property: PG_BASE_URL
    - secretKey: TEMPORAL_API_KEY
      remoteRef:
        key: WORKFLOWS_PROD
        property: TEMPORAL_API_KEY
    - secretKey: ELEVENLABS_API_KEY
      remoteRef:
        key: WORKFLOWS_PROD
        property: ELEVENLABS_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: WORKFLOWS_PROD
        property: OPENAI_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: WORKFLOWS_PROD
        property: ANTHROPIC_API_KEY
