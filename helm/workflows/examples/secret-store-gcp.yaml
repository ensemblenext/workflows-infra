# GCP Secret Manager SecretStore + ExternalSecret
# Prerequisites:
#   1. GKE Workload Identity enabled; KSA `workflows-sa` annotated with
#      iam.gke.io/gcp-service-account = <workloads-sa>@<project>.iam.gserviceaccount.com
#      (the Terraform `service_account_annotation` output).
#   2. That GCP SA has roles/secretmanager.secretAccessor on the secret
#      (granted by the terraform-gcp `secrets` module).
#   3. External Secrets Operator installed.
#   4. Secret exists at Secret Manager id `workflows-prod-app-secrets` (a JSON blob).
#
# Apply with: kubectl apply -f secret-store-gcp.yaml -n workflows
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: workflows
spec:
  provider:
    gcpsm:
      projectID: REPLACE_PROJECT_ID # your GCP project id
      auth:
        workloadIdentity:
          clusterLocation: us-west1 # region/zone of the GKE cluster
          clusterName: REPLACE_CLUSTER_NAME
          serviceAccountRef:
            name: workflows-sa # the WI-annotated KSA
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workflows-app-secrets
  namespace: workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: app-secrets # matches `secrets.existingSecret` / `envFrom` in gcp-values.yaml
    creationPolicy: Owner
  # The secret is a JSON blob — extract every key into the k8s secret.
  dataFrom:
    - extract:
        key: workflows-prod-app-secrets
