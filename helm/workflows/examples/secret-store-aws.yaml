# AWS Secrets Manager SecretStore and ExternalSecret
# Prerequisites:
#   1. IRSA-enabled service account with SecretsManager access
#   2. External Secrets Operator installed
#   3. AWS Secrets Manager secret exists at workflows-prod/app-secrets
#
# Apply with: kubectl apply -f secret-store-aws.yaml -n workflows
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: workflows
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2  # Change to your region
      auth:
        jwt:
          serviceAccountRef:
            name: workflows-sa  # Your IRSA-enabled service account
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workflows-app-secrets
  namespace: workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: workflows-secrets
    creationPolicy: Owner
  data:
    - secretKey: PG_BASE_URL
      remoteRef:
        key: workflows-prod/app-secrets
        property: PG_BASE_URL
    - secretKey: TEMPORAL_API_KEY
      remoteRef:
        key: workflows-prod/app-secrets
        property: TEMPORAL_API_KEY
    - secretKey: ELEVENLABS_API_KEY
      remoteRef:
        key: workflows-prod/app-secrets
        property: ELEVENLABS_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: workflows-prod/app-secrets
        property: OPENAI_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: workflows-prod/app-secrets
        property: ANTHROPIC_API_KEY
