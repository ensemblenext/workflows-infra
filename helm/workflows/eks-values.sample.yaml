# Example values for AWS EKS deployment
# Usage: helm install workflows ./workflows -f eks-values.yaml
#
# See helm/workflows/references/ for full list of environment variables and secrets

global:
  imageRegistry: "123456789.dkr.ecr.us-west-2.amazonaws.com"  # Your ECR registry

# Ingress - AWS ALB Ingress Controller
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
  hosts:
    - host: workflows-us-west-2.example.com  # Replace with your domain
      paths:
        # Server endpoints
        - path: /api
          pathType: Prefix
          service: server
        - path: /mcp
          pathType: Prefix
          service: server
        - path: /channel
          pathType: Prefix
          service: server
        # Backward compatibility for external clients
        - path: /chat
          pathType: Prefix
          service: server
        - path: /workflow
          pathType: Prefix
          service: server
        # Web app (catch-all)
        - path: /
          pathType: Prefix
          service: web
  tls:
    enabled: true
    certificateArn: ""  # Set to your ACM certificate ARN

# Service Account - use the one created by eksctl in Step 7
serviceAccount:
  create: false
  name: workflows-sa

# External Secrets - Sync from AWS Secrets Manager
# Prerequisites:
#   1. Install External Secrets Operator: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#   2. Create a SecretStore named "aws-secrets-manager" in the workflows namespace
externalSecrets:
  enabled: true
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  remoteRef: workflows-prod/app-secrets  # Your AWS Secrets Manager secret ID
  refreshInterval: 1h

# If not using External Secrets, you can create a secret manually and reference it here
secrets:
  existingSecret: ""  # Leave empty when using externalSecrets

# =============================================================================
# Server Configuration
# =============================================================================
server:
  image:
    tag: latest
  replicaCount: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  autoscaling:
    enabled: false

  # Environment variables for server (optional if provided via External Secrets)
  # See references/server-variables.yaml for full list
  # config:
  #   # Required
  #   CLOUD_PROVIDER: "aws"
  #   SERVERLESS_ENVIRONMENT: "false"
  #   AUTH_PROVIDER: "cognito"
  #   SERVER_URL: "https://example.com"
  #   WEB_URL: "https://example.com"
  #   STORAGE_USER_FILES_BUCKET: ""
  #   STORAGE_DOCUMENTS_BUCKET: ""
  #   STORAGE_TENANT_MIGRATIONS_BUCKET: ""
  #   # Required for AWS
  #   AWS_REGION: "us-west-2"
  #   COGNITO_USER_POOL_ID: ""
  #   COGNITO_REGION: "us-west-2"
  #   KMS_SECRETS_KEYRING: ""
  #   KMS_SECRETS_KEY: ""
  #   KMS_CONNECTIONS_KEYRING: ""
  #   KMS_CONNECTIONS_KEY: ""
  #   KMS_ENVIRONMENT_KEYRING: ""
  #   KMS_ENVIRONMENT_KEY: ""

# =============================================================================
# Web Configuration
# =============================================================================
web:
  image:
    tag: latest
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: false

  # Environment variables for web (optional if provided via External Secrets)
  # See references/web-variables.yaml for full list
  # config:
  #   # Required
  #   AUTH_PROVIDER: "cognito"
  #   SERVER_URL: "https://example.com"
  #   WEB_URL: "https://example.com"
  #   # Required for AWS
  #   COGNITO_USER_POOL_ID: ""
  #   COGNITO_CLIENT_ID: ""
  #   COGNITO_DOMAIN: ""

# =============================================================================
# Worker Configuration
# =============================================================================
worker:
  image:
    tag: latest
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: false

  # Environment variables for worker (optional if provided via External Secrets)
  # See references/worker-variables.yaml for full list
  # config:
  #   # Required
  #   CLOUD_PROVIDER: "aws"
  #   SERVERLESS_ENVIRONMENT: "false"
  #   SERVER_URL: "https://example.com"
  #   STORAGE_USER_FILES_BUCKET: ""
  #   STORAGE_DOCUMENTS_BUCKET: ""
  #   STORAGE_TENANT_MIGRATIONS_BUCKET: ""
  #   # Required for AWS
  #   AWS_REGION: "us-west-2"
  #   KMS_SECRETS_KEYRING: ""
  #   KMS_SECRETS_KEY: ""
  #   KMS_CONNECTIONS_KEYRING: ""
  #   KMS_CONNECTIONS_KEY: ""
  #   KMS_ENVIRONMENT_KEYRING: ""
  #   KMS_ENVIRONMENT_KEY: ""

# Node placement - use specific node groups if needed
nodeSelector: {}

tolerations: []

affinity: {}
