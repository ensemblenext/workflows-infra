
environments:
  required:
    - CLOUD_PROVIDER # aws, gcp
    - SERVERLESS_ENVIRONMENT # true, false
    - SERVER_URL
    - STORAGE_USER_FILES_BUCKET
    - STORAGE_DOCUMENTS_BUCKET
    - STORAGE_TENANT_MIGRATIONS_BUCKET
    - KMS_SECRETS_KEYRING
    - KMS_SECRETS_KEY
    - KMS_CONNECTIONS_KEYRING
    - KMS_CONNECTIONS_KEY
    - KMS_ENVIRONMENT_KEYRING
    - KMS_ENVIRONMENT_KEY
  required[aws]:
    - AWS_REGION
  required[gpc]:
    - GOOGLE_CLOUD_PROJECT
    - GCP_REGION
    - GCP_SERVICE_ACCOUNT
    - KMS_LOCATION_ID
  optional:
    - LOG_LEVEL # trace|debug|info|warn|error|fatal (default: info). debug is very verbose on hot paths.
    - TEMPORAL_HOST
    - TEMPORAL_NAMESPACE
    - TEMPORAL_TASK_QUEUE
    - TEMPORAL_TLS # true, false
    - TEMPORAL_TLS_CA # CA certificate path (mTLS)
    - TEMPORAL_TLS_CERT # Client certificate path (mTLS)
    # Redis (centralized cache store for environment-change cache invalidation
    # during tool execution). Active only when REDIS_HOST is set AND
    # SERVERLESS_ENVIRONMENT=false; otherwise an in-memory per-instance store is used.
    - REDIS_HOST
    - REDIS_PORT # default: 6379
    - REDIS_TLS # true, false (default: false)
    - REDIS_USERNAME # Redis 6+ ACL user; leave unset to auth as the default user
    - DEFAULT_LLM_MODEL_FAMILY # default is haiku (haiku, sonnet, gpt, gpt-mini, gemini-pro, gemini-flash, kimi, glm)
    # SQS consumer. Cloud Tasks delivers over HTTP by itself; SQS only holds messages,
    # so on AWS this pod reads them and makes the call each one describes. It starts
    # only when TASK_QUEUE_PROVIDER=sqs and both the prefix and the queue list are set,
    # and stays inert otherwise.
    - TASK_QUEUE_PROVIDER # cloud-tasks | sqs | in-process
    - SQS_QUEUE_URL_PREFIX # account queue URL without the queue name
    - SQS_CONSUMER_QUEUES # comma-separated queue names this pod should consume, e.g. evaluation-cases,webhook-processor
    - SQS_CONSUMER_CONCURRENCY # default: 5, messages handled at once per queue
    - SQS_HANDLER_TIMEOUT_SECONDS # default: 600; also sets the message visibility window
    - SQS_ENDPOINT_URL # local testing against ElasticMQ or LocalStack; unset in a real deployment
    # Evaluations. This pod runs the sweep that fails runs whose queued cases stopped
    # arriving, so these decide how long an unfinished run is given before it is
    # presumed abandoned.
    - EVALUATION_CASE_TIMEOUT_SECONDS # default: 600
    - EVALUATION_RUN_STALE_SECONDS # default: 4x the case timeout
    # Token for the callback this pod makes when delivering a queued task. Obtained per
    # delivery, because one fetched when the message was queued would often have expired
    # by the time a delayed or redelivered message is consumed. Without these the
    # consumer falls back to TASK_CALLBACK_SECRET.
    - TASK_CALLBACK_OAUTH_TOKEN_URL # Cognito token endpoint
    - TASK_CALLBACK_OAUTH_CLIENT_ID
    - TASK_CALLBACK_OAUTH_SCOPE

secrets:
  required:
    - PG_BASE_URL
    - TEMPORAL_API_KEY
  optional:
    - SYSTEM_DB_NAME
    - GOOGLE_MAPS_API_KEY
    - BRAVE_SEARCH_API_KEY
    - ELEVENLABS_API_KEY
    - AIRTABLE_API_KEY
    # Slack
    - SLACK_BOT_TOKEN
    - SLACK_SIGNING_SECRET
    # Twilio
    - TWILIO_ACCOUNT_SID
    - TWILIO_API_KEY_SID
    - TWILIO_API_KEY_SECRET
    - TWILIO_AUTH_TOKEN
    - TWILIO_PHONE_NUMBER
    # Built-in LLM
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - DEEPSEEK_API_KEY
    - GEMINI_API_KEY
    - CEREBRAS_API_KEY
    - MOONSHOTAI_API_KEY
    - ZHIPU_API_KEY
    # Neon database
    - NEON_API_KEY
    - NEON_BRANCH
    - NEON_OWNER_NAME
    - NEON_PROJECT
    # Email service
    - RESEND_API_KEY
    - SENDGRID_API_KEY
    # Redis
    - REDIS_PASSWORD # only if the Redis instance requires auth
    # Task queue callback
    - TASK_CALLBACK_OAUTH_CLIENT_SECRET # client credentials for the token above
    - TASK_CALLBACK_SECRET # fallback when the OAuth variables are not set

