

environments:
  required:
    - AUTH_PROVIDER # firebase, cognito
    - SERVER_URL
    - WEB_URL
  required[aws]:
    - COGNITO_USER_POOL_ID
    - COGNITO_CLIENT_ID
    - COGNITO_DOMAIN
  required[firebase]:
    - FIREBASE_API_KEY
    - FIREBASE_AUTH_DOMAIN
