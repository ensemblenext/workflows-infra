    - FIREBASE_STORAGE_BUCKET
    - FIREBASE_MESSAGING_SENDER_ID
    - FIREBASE_APP_ID
    - FIREBASE_MEASUREMENT_ID
  optional:
    - TEMPORAL_WORKFLOW_URL
secrets:
  optional:
    - ELEVENLABS_API_KEY
   
  
  
