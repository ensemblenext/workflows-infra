

environments:
  required:
    - AUTH_PROVIDER # firebase, cognito
    - SERVER_URL
    - WEB_URL
    - SYSTEM_ACCOUNT_EMAILS # a comma-separated list of emails
  required[aws]:
    - AWS_COGNITO_USER_POOL_ID
    - AWS_COGNITO_CLIENT_ID
    - AWS_COGNITO_DOMAIN
  required[firebase]:
    - FIREBASE_API_KEY
    - FIREBASE_AUTH_DOMAIN
    - FIREBASE_PROJECT_ID
    - FIREBASE_STORAGE_BUCKET
    - FIREBASE_MESSAGING_SENDER_ID
    - FIREBASE_APP_ID
    - FIREBASE_MEASUREMENT_ID
  optional:
    - TEMPORAL_WORKFLOW_URL
    - SELF_HOSTING # Enable self-hosting mode: hides tenant/user switching and invite (default: false)
    # Login Methods Configuration
    # Only email/password is enabled by default
    # Values: true, false
    - LOGIN_EMAIL_PASSWORD_ENABLED # Enable email/password login (default: true)
    - LOGIN_GOOGLE_ENABLED         # Enable Google OAuth (default: false)
    - LOGIN_MICROSOFT_ENABLED      # Enable Microsoft OAuth (default: false)
    - LOGIN_OKTA_ENABLED           # Enable Okta OIDC (default: false)

secrets:
  optional:
    - ELEVENLABS_API_KEY
   
  
  
