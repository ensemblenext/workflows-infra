

environments:
  required:
    - CLOUD_PROVIDER # aws, gcp
    - SERVERLESS_ENVIRONMENT # true, false
    - AUTH_PROVIDER # firebase, cognito
    - SERVER_URL
    - WEB_URL
    - SYSTEM_ADMIN_EMAILS # a comma-separated list of emails
    - SCHEDULER_SERVICE_URL
    - STORAGE_USER_FILES_BUCKET
    - STORAGE_DOCUMENTS_BUCKET
    - STORAGE_TENANT_MIGRATIONS_BUCKET
    - STORAGE_EXPORTS_BUCKET # for the export feature
    - KMS_SECRETS_KEYRING
    - KMS_SECRETS_KEY
    - KMS_CONNECTIONS_KEYRING
    - KMS_CONNECTIONS_KEY
    - KMS_ENVIRONMENT_KEYRING
    - KMS_ENVIRONMENT_KEY
  required[aws]:
    - AWS_REGION
    - AWS_COGNITO_USER_POOL_ID
    - AWS_COGNITO_REGION
    - AWS_SCHEDULER_EVENT_SOURCE
    - AWS_SCHEDULER_GROUP_NAME
    - AWS_SCHEDULER_ROLE_ARN
    - AWS_SCHEDULER_TARGET_ARN
  required[gpc]:
    - GOOGLE_CLOUD_PROJECT
    - GCP_REGION
    - GCP_SERVICE_ACCOUNT
    - KMS_LOCATION_ID
  required[firebase]:
    - FIREBASE_API_KEY
    - FIREBASE_AUTH_DOMAIN
    - FIREBASE_PROJECT_ID
    - FIREBASE_STORAGE_BUCKET
    - FIREBASE_MESSAGING_SENDER_ID
    - FIREBASE_APP_ID
    - FIREBASE_MEASUREMENT_ID
  optional:
    - LOG_LEVEL # trace|debug|info|warn|error|fatal (default: info). debug is very verbose on hot paths.
    - SELF_HOSTING # Enable self-hosting mode: restricts tenant deletion to superuser only (default: false)
    - TEMPORAL_HOST
    - TEMPORAL_NAMESPACE
    - TEMPORAL_TASK_QUEUE
    - TEMPORAL_TLS # true, false
    - TEMPORAL_TLS_CA # CA certificate path (mTLS)
    - TEMPORAL_TLS_CERT # Client certificate path (mTLS)
    # Redis (enables the centralized cache store: cross-instance AI rate limiting
    # and environment-change cache invalidation). Active only when REDIS_HOST is
    # set AND SERVERLESS_ENVIRONMENT=false; otherwise an in-memory per-instance store is used.
    - REDIS_HOST
    - REDIS_PORT # default: 6379
    - REDIS_TLS # true, false (default: false)
    - REDIS_USERNAME # Redis 6+ ACL user; leave unset to auth as the default user
    - DEFAULT_LLM_MODEL_FAMILY # default is haiku (haiku, sonnet, gpt, gpt-mini, gemini-pro, gemini-flash, kimi, glm)
    # Background task queue. Unset means tasks run in-process: they execute, but a
    # restart loses anything in flight and nothing is retried. Setting
    # TASK_QUEUE_ENABLED=true requires TASK_QUEUE_PROVIDER, and a provider that is
    # named but not configured fails loudly at the first task rather than silently
    # falling back.
    - TASK_QUEUE_ENABLED # true, 1 to use a queue; anything else runs in-process
    - TASK_QUEUE_PROVIDER # cloud-tasks | sqs | in-process
    - SQS_QUEUE_URL_PREFIX # account queue URL without the queue name, e.g. https://sqs.<region>.amazonaws.com/<account-id>
    - SQS_ENDPOINT_URL # local testing against ElasticMQ or LocalStack; unset in a real deployment
    - WEBHOOK_QUEUE_NAME # default: webhook-processor
    # Evaluations. Each test case is queued separately, so these bound one case, not a
    # whole run.
    - EVALUATION_QUEUE_NAME # default: evaluation-cases
    - EVALUATION_CASE_TIMEOUT_SECONDS # default: 600
    - EVALUATION_RUN_STALE_SECONDS # default: 4x the case timeout; after this an unfinished run is marked failed
    # The queue calls back into this service to run one case, and that endpoint can
    # invoke an agent, so it is authenticated. On GCP, Cloud Tasks presents an OIDC
    # token and GCP_SERVICE_ACCOUNT above is the account it must come from -- it is
    # required, not advisory: without it the token is refused.
    - TASK_CALLBACK_OAUTH_SCOPE # AWS only: the scope the worker's Cognito token must carry
    # Vector Embedding
    - VECTOR_EMBEDDING_PROVIDER # openai, azure, bedrock (default: openai)
    - VECTOR_EMBEDDING_MODEL # default: text-embedding-3-small
    - VECTOR_EMBEDDING_API_ENDPOINT # Azure endpoint
    - VECTOR_EMBEDDING_REGION # Bedrock region (falls back to AWS_REGION)
    - VECTOR_EMBEDDING_DIMENSIONS # optional dimensions for models that support it

secrets:
  required:
    - PG_BASE_URL
    - TEMPORAL_API_KEY
  optional:
    - SYSTEM_DB_NAME
    - GOOGLE_MAPS_API_KEY
    - BRAVE_SEARCH_API_KEY
    - ELEVENLABS_API_KEY
    - AIRTABLE_API_KEY
    # Slack
    - SLACK_BOT_TOKEN
    - SLACK_SIGNING_SECRET
    # Twilio
    - TWILIO_ACCOUNT_SID
    - TWILIO_API_KEY_SID
    - TWILIO_API_KEY_SECRET
    - TWILIO_AUTH_TOKEN
    - TWILIO_PHONE_NUMBER
    # Built-in LLM
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - DEEPSEEK_API_KEY
    - GEMINI_API_KEY
    - CEREBRAS_API_KEY
    - MOONSHOTAI_API_KEY
    - ZHIPU_API_KEY
    # Neon database
    - NEON_API_KEY
    - NEON_BRANCH
    - NEON_OWNER_NAME
    - NEON_PROJECT
    # Email service
    - RESEND_API_KEY
    - SENDGRID_API_KEY
    # Vector Embedding
    - VECTOR_EMBEDDING_API_KEY # API key for OpenAI/Azure embeddings (falls back to OPENAI_API_KEY)
    # Redis
    - REDIS_PASSWORD # only if the Redis instance requires auth
    # Task queue callback. Only used where the caller cannot present a token: the
    # in-process provider, and local runs. Cloud Tasks uses OIDC and the worker's SQS
    # consumer uses Cognito, neither of which needs this.
    - TASK_CALLBACK_SECRET
  
  
