

environments:
  required:
    - CLOUD_PROVIDER # aws, gcp
    - SERVERLESS_ENVIRONMENT # true, false
    - AUTH_PROVIDER # firebase, cognito
    - SERVER_URL
    - WEB_URL
    - SCHEDULER_SERVICE_URL
    - STORAGE_USER_FILES_BUCKET
    - STORAGE_DOCUMENTS_BUCKET
    - STORAGE_TENANT_MIGRATIONS_BUCKET
    - KMS_SECRETS_KEYRING
    - KMS_SECRETS_KEY
    - KMS_CONNECTIONS_KEYRING
    - KMS_CONNECTIONS_KEY
    - KMS_ENVIRONMENT_KEYRING
    - KMS_ENVIRONMENT_KEY
  required[aws]:
    - AWS_REGION
    - AWS_COGNITO_USER_POOL_ID
    - AWS_COGNITO_REGION
    - AWS_SCHEDULER_EVENT_SOURCE
    - AWS_SCHEDULER_GROUP_NAME
    - AWS_SCHEDULER_ROLE_ARN
    - AWS_SCHEDULER_TARGET_ARN
  required[gpc]:
    - GOOGLE_CLOUD_PROJECT
    - GCP_REGION
    - GCP_SERVICE_ACCOUNT
    - KMS_LOCATION_ID
  required[firebase]:
    - FIREBASE_API_KEY
    - FIREBASE_AUTH_DOMAIN
    - FIREBASE_PROJECT_ID
    - FIREBASE_STORAGE_BUCKET
    - FIREBASE_MESSAGING_SENDER_ID
    - FIREBASE_APP_ID
    - FIREBASE_MEASUREMENT_ID
  optional:
    - TEMPORAL_HOST
    - TEMPORAL_NAMESPACE
    - TEMPORAL_TASK_QUEUE
    - TEMPORAL_TLS # true, false
    - DEFAULT_LLM_MODEL_FAMILY # default is haiku (haiku, sonnet, gpt, gpt-mini, gemini-pro, gemini-flash, kimi, glm)

secrets:
  required:
    - PG_BASE_URL
    - TEMPORAL_API_KEY
  optional:
    - SYSTEM_DB_NAME
    - GOOGLE_MAPS_API_KEY
    - BRAVE_SEARCH_API_KEY
    - ELEVENLABS_API_KEY
    - AIRTABLE_API_KEY
    # Slack
    - SLACK_BOT_TOKEN
    - SLACK_SIGNING_SECRET
    # Twilio
    - TWILIO_ACCOUNT_SID
    - TWILIO_API_KEY_SID
    - TWILIO_API_KEY_SECRET
    - TWILIO_AUTH_TOKEN
    - TWILIO_PHONE_NUMBER
    # Built-in LLM
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - DEEPSEEK_API_KEY
    - GEMINI_API_KEY
    - CEREBRAS_API_KEY
    - MOONSHOTAI_API_KEY
    - ZHIPU_API_KEY
    # Neon database
    - NEON_API_KEY
    - NEON_BRANCH
    - NEON_OWNER_NAME
    - NEON_PROJECT
    # Email service
    - RESEND_API_KEY
    - SENDGRID_API_KEY
  
  
