{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "workflows.fullname" . }}-app-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled=true" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ include "workflows.fullname" . }}-secrets
    creationPolicy: Owner
  {{- if .Values.externalSecrets.data }}
  # Map individual keys from the secret provider
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
    {{- end }}
  {{- else }}
  # Extract all keys from a single secret
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.remoteRef is required when externalSecrets.enabled=true" .Values.externalSecrets.remoteRef }}
  {{- end }}
{{- end }}
