{{- /*
Optional: Create secrets directly in the chart.
Disabled by default - use external secret managers (Doppler, AWS Secrets Manager, etc.) instead.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workflows.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.elevenlabsApiKey }}
  ELEVENLABS_API_KEY: {{ .Values.secrets.elevenlabsApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.temporalApiKey }}
  TEMPORAL_API_KEY: {{ .Values.secrets.temporalApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.schedulerCallbackApiKey }}
  SCHEDULER_CALLBACK_API_KEY: {{ .Values.secrets.schedulerCallbackApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.firebaseProjectId }}
  FIREBASE_PROJECT_ID: {{ .Values.secrets.firebaseProjectId | quote }}
  {{- end }}
  {{- if .Values.secrets.firebasePrivateKey }}
  FIREBASE_PRIVATE_KEY: {{ .Values.secrets.firebasePrivateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.firebaseClientEmail }}
  FIREBASE_CLIENT_EMAIL: {{ .Values.secrets.firebaseClientEmail | quote }}
  {{- end }}
  {{- if .Values.database.external.enabled }}
  DATABASE_PASSWORD: ""  # Should be provided via existingSecret or external secret manager
  {{- end }}
{{- end }}
