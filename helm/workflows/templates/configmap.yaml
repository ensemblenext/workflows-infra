apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workflows.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  {{- if .Values.database.external.enabled }}
  DATABASE_HOST: {{ .Values.database.external.host | quote }}
  DATABASE_PORT: {{ .Values.database.external.port | quote }}
  DATABASE_NAME: {{ .Values.database.external.database | quote }}
  DATABASE_SSL_MODE: {{ .Values.database.external.sslMode | quote }}
  {{- end }}
  {{- if .Values.secrets.temporalAddress }}
  TEMPORAL_ADDRESS: {{ .Values.secrets.temporalAddress | quote }}
  {{- end }}
  {{- if .Values.secrets.temporalNamespace }}
  TEMPORAL_NAMESPACE: {{ .Values.secrets.temporalNamespace | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
