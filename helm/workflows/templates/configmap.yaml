{{- /*
ConfigMap is optional. You can enable it by setting configMap.enabled=true
if you need non-secret environment variables that aren't provided through secrets.
*/ -}}
{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workflows.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "workflows.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
